# Audience-specific summaries. Keep the same facts; change the emphasis.
# "{years}" is replaced with the years since career_start in profile.yml.

short: >-
  Dr. Sergio Ruocco is a Senior Software Engineer at EMASS, an NTU/A*STAR
  spin-off in Singapore, where he builds the full software stack (from the development boards'
  boot-agent firmware to the SDK), leads the Zephyr RTOS port with a team he
  recruited and mentors, and builds the CI/CD
  build and test pipeline, and the IT/DevOps infrastructure for ECS-DoT, an
  ultra-low-power AI SoC with a RISC-V core and dedicated hardware
  accelerators, used by the EMASS engineering team and its customers. He has {years} years of academic and industrial R&D in embedded and
  real-time systems, operating-system kernels and compilers. He holds a Master's
  degree cum laude and a PhD in Computer Science from the Università degli Studi
  di Milano, and has worked at NTU, A*STAR, the Università di Milano-Bicocca and
  NICTA/Data61 in Sydney. His projects include real-time extensions to the L4
  microkernel, the port of ARM MbedOS and its SDK to the ECS-DoT RISC-V SoC,
  Linux memory-management extensions for non-volatile DIMMs (which led to a CERN
  OpenLab collaboration), Linux and MbedOS drivers for video and deep-learning
  accelerators, and the port of GCC to a custom 16-bit microcontroller for
  NAND/NOR non-volatile memory under hard real-time constraints.

academic: >-
  Dr. Ruocco's research concerns the analysis, design and implementation of
  time-sensitive and time-aware computer systems. His PhD introduced temporal
  reflection, a class of computational reflection through which a system can
  represent, observe and control its own temporal behaviour; he designed and
  implemented a reflective real-time scheduler for the L4 microkernel. At NICTA
  he analysed and improved the real-time properties of general-purpose L4
  microkernels. At A*STAR and NTU he worked on systems software and programming
  toolchains for non-volatile memory, storage systems, RISC-V
  platforms and AI accelerators, including the port of MbedOS and Linux device
  drivers to the ECS-DoT SoC and its AI accelerator. He is currently a
  Senior Software Engineer at EMASS, building the full software stack (from the development boards'
  boot-agent firmware to the SDK), leading the Zephyr RTOS port with junior
  engineers he recruited and mentors, and building the
  CI/CD build and test pipeline, and the IT/DevOps infrastructure for the
  ECS-DoT ultra-low-power AI SoC used by the EMASS engineering team and its
  customers. His work has appeared at IEEE RTSS, ISCAS,
  TCAS-I and JETCAS and in the EURASIP Journal on Embedded Systems, and has led
  to a US patent and several technology disclosures licensed to EMASS Pte Ltd.

industry: >-
  Hands-on systems R&D leader with {years} years of experience spanning operating
  systems, compilers and embedded platforms. Dr. Ruocco is currently a Senior
  Software Engineer at EMASS, where he builds the bare-metal SDK and runtime, the
  Zephyr RTOS port (which he planned, staffed and leads, mentoring the junior
  engineers who implement it), the Raspberry Pi Pico 2 boot-agent firmware of its development
  boards, the CI/CD build and test pipeline, and the
  IT/DevOps infrastructure for the ECS-DoT ultra-low-power RISC-V AI SoC, used
  by the EMASS engineering team and its customers. This work began at NTU
  (2024–2025), where as a Research Fellow he kept the ECS-DoT system software
  going between A*STAR I²R and EMASS, developing the first bare-metal SDK and
  its SPI and camera drivers and isolating hardware bugs in the SoC's SPI
  peripheral. He has a track
  record of taking poorly documented hardware and turning it into working systems: GCC
  backends, Linux kernel and driver code, RTOS ports, board-support packages and
  performance-analysis tools. He is comfortable from board bring-up and JTAG to
  kernel memory management and compiler internals, and has led industry projects
  for Seagate and Micron as well as EU-funded R&D with STMicroelectronics. He
  combines deep technical work with project leadership, procurement and
  end-to-end delivery.

consulting: >-
  Dr. Sergio Ruocco is an embedded-systems and toolchain consultant with {years} years
  of experience in Linux kernel and driver development, real-time operating
  systems, compiler toolchains, and non-volatile memory. He helps
  teams de-risk unfamiliar hardware and software: porting operating systems and
  SDKs to new SoCs, writing and debugging kernel drivers, building GCC backends,
  improving real-time behaviour, analysing system performance, and setting up
  CI/CD build and test pipelines and IT/DevOps infrastructure. He is currently a
  Senior Software Engineer at EMASS, an NTU/A*STAR spin-off, where he builds the
  full software stack, leads the Zephyr
  RTOS port with a team he recruited and mentors, and runs the CI/CD and
  IT/DevOps infrastructure for the ECS-DoT ultra-low-power RISC-V AI SoC. His clients have included Seagate
  (USA) and Micron Italy, and he has led EU ENIAC projects with STMicroelectronics.
