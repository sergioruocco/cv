- id: emass-ai-soc
  period: "2024 – present"
  title: "Full software stack for the ECS-DoT ultra-low-power RISC-V AI SoC"
  context: "NTU, then EMASS (an NTU/A*STAR spin-off) from 06/2025"
  description: >-
    Research and develop the device drivers, RTOS, SDK and toolchains needed to
    compile, optimise and run AI applications on ECS-DoT, a custom ultra-low-power
    SoC with a RISC-V core and dedicated hardware accelerators, designed and
    fabricated by the team.
  impact: >-
    Enables AI workloads on the ECS-DoT SoC; builds on the AI-accelerator driver
    and RTOS work done at A*STAR I²R.
  featured: true
  tags: [academic, industry, consulting]

- id: ecsdot-boot-agent
  period: "2026 – present"
  title: "ECS-DoT boot agent and JTAG adapter on the Raspberry Pi Pico 2"
  context: "EMASS · ECS-DoT development boards"
  description: >-
    Extended the open-source DirtyJTAG firmware into the boards' boot agent: it
    loads RISC-V applications into the SoC over JTAG at power-up, serves as an
    OpenOCD adapter and USB-serial bridge, and drives the boards' power control
    and measurement.
  impact: >-
    Shipped to customers in tagged firmware releases since 07/2026.
  featured: true
  tags: [industry, consulting, academic]

- id: mbedos-ecsdot
  period: "2020 – 2024"
  title: "MbedOS and SDK port to the ECS-DoT RISC-V SoC"
  context: "A*STAR I²R / NTU · ECS-DoT Edge SoC with AI acceleration"
  description: >-
    Ported the ARM MbedOS 5.12.4 RTOS and its SDK to the ECS-DoT SoC,
    covering a different CPU core, instruction set, peripherals, memory map and
    I/O devices. Both the original and the target platforms were poorly
    documented and buggy, so the work was a complex trial-and-error effort with
    the GCC toolchain and GDB.
  impact: >-
    Delivered a working RTOS port and board-support package; technology
    disclosure SWIP-PMEP-2022-31, licensed to EMASS Pte Ltd.
  featured: true
  tags: [industry, consulting, academic]

- id: ai-accelerator-driver
  period: "2022 – 2023"
  title: "AI accelerator Linux kernel driver port to MbedOS on RISC-V"
  context: "A*STAR I²R · ECS-DoT"
  description: >-
    Ported the AI accelerator's ARM Linux kernel driver to MbedOS on the ECS-DoT
    RISC-V CPU, adapting the driver to a new operating system, memory map and
    device model.
  impact: >-
    Technology disclosure SWIP-PNVD-2022-33, licensed to EMASS Pte Ltd.
  featured: true
  tags: [industry, consulting, academic]

- id: ai-accelerator-tracing
  period: "2022 – 2023"
  title: "Tracing the Linux compiler and kernel driver for an AI accelerator"
  context: "A*STAR I²R · ECS-DoT"
  description: >-
    Built tracing and analysis tooling for the Linux compiler and kernel driver
    of the AI accelerator.
  impact: >-
    Technology disclosure SWIP-TLCN-2022-32, licensed to EMASS Pte Ltd.
  featured: false
  tags: [industry, consulting, academic]

