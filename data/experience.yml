- period: "06/2025 – present"
  role: "Senior Software Engineer"
  org: "EMASS (an NTU/A*STAR spin-off)"
  location: "Singapore"
  summary: >-
    End-to-end software for ECS-DoT, an ultra-low-power AI SoC with a RISC-V core
    and dedicated hardware accelerators. Research and development of the full stack
    of software and tools — device drivers, RTOS, SDK and toolchains — to
    compile, optimise and run AI applications on a custom SoC designed and
    fabricated by the team.
  highlights:
    - "Planned the port of the Zephyr RTOS to ECS-DoT and, once approved, delivered it on time by training and mentoring a new junior team (a graduate engineer and three first-year computer-engineering interns); packages the Zephyr SDK (board support, containers, debug tooling)."
    - "Develops and releases the bare-metal SDK and runtime of the ECS-DoT ultra-low-power AI SoC; integrates and qualifies the GCC RISC-V cross-toolchains (GCC 7 and GCC 11, x86-64 and arm64 hosts)."
    - "Targets a RISC-V core with dedicated deep-learning accelerators for edge AI IoT applications."
    - "Built the ECS-DoT boot agent on the open-source DirtyJTAG firmware for the Raspberry Pi Pico 2 (RP2350) of the ECS-DoT development boards: it loads RISC-V applications into the SoC over JTAG at power-up, doubles as an OpenOCD adapter and USB-serial bridge, controls board power, and has shipped to customers in tagged releases since 07/2026."
    - "Fixed and extended the OpenOCD DirtyJTAG adapter driver (protocol, bit ordering, multi-adapter selection, reset lines) to drive the SoC's RISC-V debug module; designed the boot agent's companion link to the ECS-DoT runtime for dynamic voltage and frequency scaling and on-board power measurement of AI inference."
    - "Designed and runs the SDK build-and-release pipeline: a three-tier container hierarchy (Linux devtools, vanilla bare-metal and Zephyr SDKs, per-customer SDK images) on self-hosted GitLab CI with cross-project rebuild cascades, published to GitHub and GitLab registries; regular bare-metal SDK releases since v4.0.0 (04/2026)."
  tags: [academic, industry, consulting]

- period: "04/2024 – 05/2025"
  role: "Research Fellow"
  org: "School of Computer Science and Engineering, Nanyang Technological University (NTU)"
  location: "Singapore"
  summary: >-
    Kept the ECS-DoT system-software engineering going between A*STAR I²R and
    EMASS, laying the groundwork for the EMASS role: the first bare-metal SDK,
    its SPI and camera drivers, and analysis of hardware bugs in the SoC's SPI
    peripheral.
  highlights:
    - "Developed the first bare-metal SDK for the ECS-DoT SoC."
    - "Completed the bit-bang SPI driver and ported an SPI camera driver to the bare-metal SDK."
    - "Isolated and analysed hardware bugs in the SoC's hardware SPI peripheral."
  tags: [academic, industry, consulting]

- period: "06/2018 – 09/2023"
  role: "Senior Scientist II"
  org: "A*STAR Institute for Infocomm Research (I²R)"
  location: "Singapore"
  summary: >-
    Embedded real-time operating systems, SDKs, firmware and drivers for a
    RISC-V-based SoC customised with a deep-learning accelerator for
    ultra-low-power edge-IoT applications.
  highlights:
    - "Delivered the port of ARM MbedOS 5.12.4 and its SDK to the ECS-DoT RISC-V SoC, including CPU core, peripherals, memory map and I/O devices."
    - "Ported the AI accelerator's ARM Linux kernel driver to MbedOS on the ECS-DoT RISC-V CPU, and traced the Linux compiler and kernel driver for the accelerator."
    - "Containerised the ECS-DoT SDK build with Docker, including OpenOCD and JTAG/USB board access (2023): the starting point of the SDK build-and-release pipeline later run at EMASS."
    - "Contributed to the Edge SoC with AI acceleration technology disclosure (TD2022128) and three software disclosures, all licensed to EMASS Pte Ltd."
  tags: [academic, industry, consulting]

